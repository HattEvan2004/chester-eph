<svg viewBox="0 0 1600 1200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M64 0H0V64" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1600" height="1200" fill="#1f1d1a"/>
  <rect width="1600" height="1200" fill="url(#grid)"/>

  <g stroke="#5b554c" stroke-width="22" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M140 240 V560 Q140 620 200 620 H700"/>
    <path d="M1460 980 V680 Q1460 620 1400 620 H760"/>
  </g>
  <g stroke="#6ea3c4" stroke-width="22" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M700 620 H760"/>
    <path d="M420 1040 V780 Q420 720 480 720 H980 Q1040 720 1040 660 V300"/>
  </g>
  <!-- couplings -->
  <g fill="#1f1d1a" stroke="#cfc9bd" stroke-width="6">
    <circle cx="140" cy="240" r="30"/>
    <circle cx="1460" cy="980" r="30"/>
    <circle cx="420" cy="1040" r="30"/>
    <circle cx="1040" cy="300" r="30"/>
  </g>
  <!-- gate valve -->
  <g transform="translate(700,560)" stroke="#cfc9bd" stroke-width="6" fill="#1f1d1a">
    <rect x="-26" y="0" width="52" height="120"/>
    <line x1="-60" y1="22" x2="60" y2="22"/>
    <line x1="0" y1="-40" x2="0" y2="0"/>
    <line x1="-34" y1="-40" x2="34" y2="-40"/>
  </g>
</svg>